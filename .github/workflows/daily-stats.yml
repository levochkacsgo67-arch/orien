name: daily-stats
on:
  schedule:
    - cron: "0 22 * * *"   # 09:00 по Сахалину
  workflow_dispatch:
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 .github/scripts/daily_stats.py
        env:
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ vars.TG_CHAT }}
