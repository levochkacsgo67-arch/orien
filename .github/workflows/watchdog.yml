name: watchdog
on:
  schedule:
    - cron: "20 22 * * *"   # 09:20 по Сахалину
  workflow_dispatch:
    inputs:
      report:
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cd .github/scripts && python3 watchdog.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ vars.TG_CHAT }}
          REPORT: ${{ inputs.report }}
